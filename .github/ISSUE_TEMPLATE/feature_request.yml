name: Feature Request
description: Suggest a new feature or enhancement for Cortex Attack
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please fill this out in as much detail as possible.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched for existing feature requests and this is not a duplicate
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New scan phase / tool integration
        - AI provider support
        - Report / output format
        - CLI usability
        - Docker / deployment
        - Performance
        - Security hardening
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What are you trying to do that you can't currently do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or examples that support this request
